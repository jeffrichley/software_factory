<!-- PROTOTYPE — throwaway. Three variants of the Factory dashboard via ?variant=. Answers: what should the dashboard look like? -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio, geometry.
   Put this @layer first; product CSS outside the layer wins ordinary layout rules.
   Native hidden and closed-dialog states take precedence over component display rules. */
@layer od-layout {
  [hidden]:not([hidden="until-found" i]) { display: none !important; }
  dialog:not([open]) { display: none !important; }

  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }

  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }

  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }

  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }

  .od-icon { display: inline-block; inline-size: var(--od-icon-size, 1em); block-size: var(--od-icon-size, 1em); flex: none; }

  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }
  .od-nowrap  { white-space: nowrap; }
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; }

  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }

  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
             padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }

  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}
:root [hidden]:where(:not([hidden="until-found" i])) { display: none; }
/* /OD-LAYOUT-PRIMITIVES v1 */

/* ---------- Design tokens ---------- */
:root{
  --bg:#0b0d10; --surface:#13161b; --surface-2:#1a1e25; --surface-3:#232833;
  --line:#2a303a; --line-2:#3b4250;
  --text:#eceff3; --text-2:#aeb5c1; --text-3:#8a919d;
  --needs:#ffb224; --needs-ink:#1c1300; --needs-bg:#2a1e07; --needs-line:#7a5512;
  --done:#36d3c0; --done-bg:#0c2826;
  --working:#62abff; --working-bg:#0f2038;
  --stale:#8b929e; --stale-bg:#1b1d21;
  --pass:#45d483; --fail:#ff6b6b;
  --font-display:'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif;
  --font-body:'IBM Plex Sans', system-ui, sans-serif;
  --font-mono:'IBM Plex Mono', ui-monospace, monospace;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --fs-xs:12px; --fs-sm:14px; --fs-md:16px; --fs-lg:20px; --fs-xl:28px; --fs-2xl:40px; --fs-3xl:64px;
  --r:6px; --top-h:64px; --switcher-room:96px;
  --dur:200ms; --ease-out:cubic-bezier(.2,.7,.2,1); --ease-in:cubic-bezier(.5,0,.8,.3);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:400 var(--fs-md)/1.5 var(--font-body)}
body{min-height:100vh}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--working);outline-offset:2px}
.mono{font-family:var(--font-mono)}
.muted{color:var(--text-3)}
.eyebrow{font:600 var(--fs-xs)/1.3 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
.wi{color:var(--text);text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
@media (hover:hover){ .wi:hover{text-decoration-color:var(--working);color:#fff} }

/* buttons */
.btn{display:inline-flex;align-items:center;gap:var(--s2);min-height:40px;padding:0 var(--s4);border-radius:var(--r);
  border:1px solid var(--line-2);background:var(--surface-2);color:var(--text);cursor:pointer;font-weight:500;font-size:var(--fs-sm);
  transition:background var(--dur) var(--ease-out),border-color var(--dur) var(--ease-out)}
@media (hover:hover){ .btn:hover{background:var(--surface-3);border-color:#566071;color:#fff} }
.btn-needs{background:var(--needs);border-color:var(--needs);color:var(--needs-ink);font-weight:600}
@media (hover:hover){ .btn-needs:hover{background:#ffc552;border-color:#ffc552;color:var(--needs-ink)} }
.btn-icon{min-width:40px;padding:0;justify-content:center}

/* ---------- State badges ---------- */
.state{display:inline-flex;align-items:center;gap:6px;font:600 var(--fs-sm)/1 var(--font-body);white-space:nowrap;padding:5px 9px;border-radius:999px;border:1px solid transparent}
.st-needs{background:var(--needs);color:var(--needs-ink)}
.st-done{background:var(--done-bg);color:var(--done);border-color:#1f5a53}
.st-done-seen{background:transparent;color:var(--text-2);border-color:var(--line-2)}
.st-working{background:var(--working-bg);color:var(--working);border-color:#21406b}
.st-stale{background:var(--stale-bg);color:var(--stale);border-color:var(--line-2);border-style:dashed}
.unseen-dot{width:8px;height:8px;border-radius:50%;background:var(--done);display:inline-block}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.dot-needs{background:var(--needs);box-shadow:0 0 0 3px rgba(255,178,36,.25)}
.dot-done{background:var(--done)}
.dot-working{background:var(--working)}
.dot-stale{background:transparent;border:2px dashed var(--stale)}
.pulse{animation:pulse 1.4s var(--ease-out) infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.tag{display:inline-flex;align-items:center;gap:5px;font:600 11px/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:4px;border:1px solid var(--line-2);color:var(--text-2);white-space:nowrap}
.tag-struggle{border-color:#7a2c2c;color:#ff9a9a;background:#2a1212}
.tag-blocked{border-color:#7a2c2c;color:#ff9a9a}
.tag-frontier{border-color:#21406b;color:var(--working);border-style:dashed}
.tag-needs{background:var(--needs);border-color:var(--needs);color:var(--needs-ink)}

/* ---------- Top bar ---------- */
.top{position:sticky;top:0;z-index:20;height:var(--top-h);display:flex;align-items:center;gap:var(--s5);padding:0 var(--s5);
  background:rgba(11,13,16,.96);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font:700 var(--fs-lg)/1 var(--font-display);letter-spacing:.02em}
.brand-mark{width:22px;height:22px;border:2px solid var(--text);border-radius:3px;position:relative}
.brand-mark::after{content:"";position:absolute;inset:4px;background:var(--needs)}
.brand small{font:500 var(--fs-xs)/1 var(--font-mono);color:var(--text-3);letter-spacing:.06em;text-transform:uppercase}
.top-stats{color:var(--text-2);font-size:var(--fs-sm)}
.counts{display:flex;gap:var(--s2);margin-left:auto}
.count{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);font:600 var(--fs-sm)/1 var(--font-body);color:var(--text-2)}
.count b{font:700 var(--fs-md)/1 var(--font-mono);color:var(--text)}
.count-needs.hot{background:var(--needs);border-color:var(--needs);color:var(--needs-ink)}
.count-needs.hot b{color:var(--needs-ink)}
.clock{font:500 var(--fs-md)/1 var(--font-mono);color:var(--text-2);min-width:76px;text-align:right}

/* ---------- Shared: now headline ---------- */
.now{display:block;color:var(--text)}
.now-k{font-family:var(--font-mono);color:var(--text-3);margin-right:4px}

/* ---------- Phase track ---------- */
.ptrack{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.ptrack li{display:grid;gap:6px;--pc:var(--working)}
.ptrack .pip{display:block;height:6px;border-radius:2px;background:var(--surface-3)}
.ptrack .pl{display:block;font:500 var(--fs-xs)/1.2 var(--font-mono);color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptrack li.past .pip{background:#4a5263}
.ptrack li.past .pl{color:var(--text-2)}
.ptrack li.cur .pip{background:var(--pc);height:10px;margin-top:-2px}
.ptrack li.cur .pl{color:var(--pc);font-weight:600}
.ph-red{--pc:var(--fail)} .ph-green{--pc:var(--pass)} .ph-merged{--pc:var(--done)}
.ptrack li.ph-red,.ptrack li.ph-green,.ptrack li.ph-merged{}
.ptrack.ptrack-c{gap:2px}
.ptrack.ptrack-c .pl{display:none}
.ptrack.ptrack-c .pip{height:4px}
.ptrack.ptrack-c li.cur .pip{height:6px;margin-top:-1px}
.phase-name{font-weight:600;color:var(--pc,var(--working))}
.phase-name.ph-red{color:var(--fail)} .phase-name.ph-green{color:var(--pass)} .phase-name.ph-merged{color:var(--done)}

/* ---------- Detail (shared by drawer, modal, centre) ---------- */
.detail{display:grid;gap:var(--s5)}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font:500 var(--fs-sm)/1.4 var(--font-mono);color:var(--text-3)}
.crumbs button{background:none;border:0;padding:2px 4px;border-radius:4px;color:var(--text-2);cursor:pointer;font:inherit;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-2)}
@media (hover:hover){ .crumbs button:hover{color:#fff} }
.crumbs .cur{color:var(--text)}
.sd-h{display:grid;gap:var(--s2)}
.sd-h h2{margin:0;font:600 var(--fs-xl)/1.15 var(--font-display)}
.sd-meta{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4);align-items:center;color:var(--text-2);font-size:var(--fs-sm)}
.sd-meta .mono{color:var(--text)}
.sub-wi{color:var(--text-2);font-size:var(--fs-sm)}

.needs-detail{border:2px solid var(--needs);border-radius:var(--r);background:var(--needs-bg);overflow:hidden}
.needs-detail > header{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);background:var(--needs);color:var(--needs-ink);font:700 var(--fs-md)/1.2 var(--font-display);letter-spacing:.04em;text-transform:uppercase}
.needs-detail > header .wait{margin-left:auto;font:600 var(--fs-md)/1 var(--font-mono);text-transform:none;letter-spacing:0}
.needs-body{padding:var(--s4);display:grid;gap:var(--s3)}
.needs-q{font:500 var(--fs-lg)/1.35 var(--font-body);margin:0}
.cmd{display:block;font:500 var(--fs-md)/1.5 var(--font-mono);background:#0b0d10;border:1px solid var(--needs-line);border-radius:4px;padding:var(--s3) var(--s4);color:#ffe2a8;overflow-wrap:anywhere;white-space:pre-wrap;margin:0}
.where{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3);margin:0}
.where div{display:grid;gap:2px}
.where dt{font:600 11px/1.2 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:#d9b36a}
.where dd{margin:0;font:500 var(--fs-sm)/1.4 var(--font-mono);color:var(--text);overflow-wrap:anywhere}
.opts{display:flex;flex-wrap:wrap;gap:var(--s2)}
.opts span{border:1px solid var(--needs-line);border-radius:999px;padding:4px 10px;font-size:var(--fs-sm);color:#ffe2a8}

.panel{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:var(--s4);display:grid;gap:var(--s3)}
.panel h4,.step h4{margin:0;font:600 var(--fs-xs)/1.3 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
.kv{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s5);font-size:var(--fs-sm);color:var(--text-2)}
.kv .od-row{--od-gap:6px}
.kv .mono{color:var(--text)}

.step{display:grid;gap:var(--s4);border-top:1px solid var(--line);padding-top:var(--s5)}
.step-h{display:flex;align-items:flex-start;gap:var(--s3);justify-content:space-between}
.step-h h3{margin:4px 0 0;font:600 var(--fs-lg)/1.2 var(--font-display)}
.phase-time{margin:0;color:var(--text-2);font-size:var(--fs-sm)}
.step-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3)}
.checklist{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:var(--fs-sm)}
.checklist li{display:flex;gap:8px;align-items:flex-start}
.checklist .cb{flex:none;width:16px;height:16px;margin-top:2px;border:1.5px solid var(--line-2);border-radius:3px;display:grid;place-items:center;color:var(--bg)}
.checklist li.done .cb{background:var(--text-2);border-color:var(--text-2)}
.checklist li.done span:last-child{color:var(--text-3);text-decoration:line-through;text-decoration-color:var(--line-2)}
.checklist li.cur span:last-child{color:var(--text);font-weight:500}
.checklist li.cur .cb{border-color:var(--working)}
.tests{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2) var(--s3);font-size:var(--fs-sm)}
.tpulse{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
.tpulse.pass{background:var(--pass)} .tpulse.fail{background:var(--fail)}
.tpulse.running{animation:pulse .8s var(--ease-out) infinite}
.tests .lbl-pass{color:var(--pass);font-weight:600} .tests .lbl-fail{color:var(--fail);font-weight:600}
.thist{display:inline-flex;gap:2px;align-items:flex-end}
.thist i{display:block;width:6px;height:16px;border-radius:1px}
.thist i.p{background:var(--pass);opacity:.75} .thist i.f{background:var(--fail);height:20px}
.files,.commits,.events,.checks,.merges,.actions-list{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:var(--fs-sm)}
.files li,.commits li,.checks li,.merges li{display:flex;gap:var(--s2);align-items:baseline}
.files .path{font-family:var(--font-mono);flex:1 1 0;min-width:0;overflow-wrap:anywhere}
.churn{color:#ff9a9a}
.add{color:var(--pass);font-family:var(--font-mono)} .del{color:var(--fail);font-family:var(--font-mono)}
.sha{font-family:var(--font-mono);color:var(--working)}
.commits .msg{flex:1 1 0;min-width:0}
.dstat{display:inline-flex;gap:1px;flex:none}
.dstat i{display:block;width:6px;height:10px;border-radius:1px;background:var(--surface-3)}
.dstat i.a{background:var(--pass)} .dstat i.d{background:var(--fail)}
.big-num{font:700 var(--fs-xl)/1 var(--font-mono)}
.events li{display:grid;grid-template-columns:72px minmax(0,1fr);gap:var(--s3);color:var(--text-2)}
.events time{font-family:var(--font-mono);color:var(--text-3)}
.chk-pass{color:var(--pass)} .chk-fail{color:var(--fail)} .chk-pending{color:var(--needs)}
.pr-line{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center}
.prtrack{display:flex;gap:4px;align-items:center;font:500 var(--fs-xs)/1 var(--font-mono);color:var(--text-3)}
.prtrack span{padding:4px 8px;border-radius:4px;border:1px solid var(--line)}
.prtrack span.cur{border-color:var(--text-2);color:var(--text)}
.actions-list li{display:grid;grid-template-columns:72px minmax(0,1fr);gap:var(--s3)}
.actions-list time{font-family:var(--font-mono);color:var(--text-3)}
.hint{color:var(--text-3);font-size:var(--fs-sm);margin:0}

/* Spec DAG */
.spec{display:grid;gap:var(--s4)}
.spec-meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s3)}
.spec-meta .od-stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--s3) var(--s4)}
.spec-meta .v{font:600 var(--fs-md)/1.3 var(--font-mono);overflow-wrap:anywhere}
.dag-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--s4)}
.dag{display:block;width:100%;height:auto;margin:0 auto}
.dag .edge{fill:none;stroke:#4a5263;stroke-width:1.5}
.dag .edge.wait{stroke-dasharray:5 5;stroke:#6b7385}
.dag .edge.block{stroke:var(--fail);stroke-dasharray:5 5}
.dag .node{cursor:pointer}
.dag .node .nb{fill:var(--surface-2);stroke:var(--line-2);stroke-width:1.5;transition:stroke var(--dur) var(--ease-out)}
@media (hover:hover){ .dag .node:hover .nb{stroke:#7a8496} }
.dag .node:focus{outline:none}
.dag .node:focus-visible .nb{stroke:var(--working);stroke-width:2.5}
.dag .node.sel .nb{stroke:var(--text);stroke-width:2.5;fill:var(--surface-3)}
.dag .node.frontier .nb{stroke-dasharray:6 4;stroke:var(--working)}
.dag .node.sel.frontier .nb{stroke:var(--text);stroke-dasharray:none}
.dag .nt{font:600 15px var(--font-body);fill:var(--text)}
.dag .np{font:500 13px var(--font-mono);fill:var(--text-2)}
.dag .np.ph-red{fill:var(--fail)} .dag .np.ph-green{fill:var(--pass)} .dag .np.ph-merged{fill:var(--done)}
.dag .pp{fill:var(--surface-3)} .dag .pp.past{fill:#4a5263} .dag .pp.cur{fill:var(--working)}
.dag .pp.cur.ph-red{fill:var(--fail)} .dag .pp.cur.ph-green{fill:var(--pass)} .dag .pp.cur.ph-merged{fill:var(--done)}
.dag .ntag-bg{fill:none;stroke:var(--working);stroke-dasharray:3 2}
.dag .ntag{font:600 10px var(--font-mono);letter-spacing:.06em;fill:var(--working)}
.dag .ntag-bg.blk{stroke:var(--fail);stroke-dasharray:none}
.dag .ntag.blk{fill:#ff9a9a}
.dag-legend{display:flex;flex-wrap:wrap;gap:var(--s4);font-size:var(--fs-xs);color:var(--text-3);margin-top:var(--s3)}
.dag-legend span{display:inline-flex;align-items:center;gap:6px}
.lg-line{display:inline-block;width:24px;border-top:2px solid #4a5263}
.lg-line.wait{border-top-style:dashed;border-color:#6b7385}
.lg-line.block{border-top-style:dashed;border-color:var(--fail)}
.spec-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3)}

/* ---------- Variant A — Triage list ---------- */
.va{padding:var(--s5) var(--s5) var(--switcher-room)}
.va-head{display:flex;align-items:baseline;gap:var(--s4);margin-bottom:var(--s4)}
.va-head h1{margin:0;font:600 var(--fs-xl)/1.1 var(--font-display)}
.va-head p{margin:0;color:var(--text-3);font-size:var(--fs-sm)}
.tri{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
.tri th,.tri td{padding:12px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.tri thead th{position:sticky;top:var(--top-h);z-index:3;background:var(--bg);font:600 var(--fs-xs)/1.2 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);border-bottom:1px solid var(--line-2)}
.tri .c-state{width:150px} .tri .c-mach{width:110px} .tri .c-repo{width:160px} .tri .c-kind{width:112px} .tri .c-wi{width:24%} .tri .c-time{width:120px}
.grp-h th{font:700 var(--fs-md)/1.2 var(--font-display);letter-spacing:.05em;text-transform:uppercase;padding:10px 14px;background:var(--surface);color:var(--text-2)}
.grp-h th .gc{font-family:var(--font-mono);margin-left:8px;color:var(--text-3)}
.grp-needs .grp-h th{background:var(--needs);color:var(--needs-ink);font-size:var(--fs-lg);padding:14px}
.grp-needs .grp-h th .gc{color:var(--needs-ink)}
.grp-needs .grp-h .od-row{--od-gap:12px}

/* ---------- Variant D — Mission control + flow strip ---------- */

  min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

.ftip{position:fixed;z-index:70;display:grid;gap:2px;max-width:320px;padding:8px 12px;background:var(--surface-3);border:1px solid var(--line-2);border-radius:var(--r);

@media (max-width:1280px){ .flow{--flow-label:112px;padding:var(--s2) var(--s4)} }

.rp-ev p{margin:4px 0 0;font-size:var(--fs-lg);line-height:1.35}
.rp-list{list-style:none;margin:0;padding:0;display:grid;gap:2px}

.rp-li > *{display:block}
.rp-li time{font-family:var(--font-mono)}
.rp-li.past{color:var(--text-2)}
.rp-li.cur{color:var(--text);background:var(--surface-3);border-color:var(--line-2)}

.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:60;background:var(--surface-3);color:var(--text);border:1px solid var(--line-2);border-radius:var(--r);padding:10px 16px;font-size:var(--fs-sm);box-shadow:0 12px 32px rgba(0,0,0,.5);max-width:min(640px,90vw)}

const nowLine = s => `<span class="now"><span class="now-k">now:</span>${esc(s.now)}</span>`;
const wiLink = (s, cls='wi') => s.workItem
  ? `<a href="#" class="${cls}" data-act="noop">${esc(s.workItem.name)}</a>`
  : `<span class="muted">— no skill</span>`;

const REASON = { permission:'Permission prompt', question:'Question', hitl:'HITL ticket', escalation:'Escalation' };
const REASON_ICON = { permission:'shield', question:'question', hitl:'flag', escalation:'flag' };
function reasonShort(n){
  if (n.kind === 'permission') return `${n.tool} <code>${esc(n.command)}</code>`;
  if (n.kind === 'question') return `“${esc(n.text)}”`;
  if (n.kind === 'hitl') return esc(n.ticket);
  return esc(n.reason);
}
const resumeCmd = s => `claude --resume ${s.sessionName}`;

function stepsOf(s){ return s.spec ? s.spec.steps : s.step ? [s.step] : []; }
function stepFor(s, stepId){
  if (s.step) return s.step;
  if (s.spec && stepId) return s.spec.steps.find(x => x.id === stepId) || null;
  return null;
}
const isFrontier = (s, st) => st.phase !== 'Merged' && st.deps.every(d => s.spec.steps.find(x => x.id === d).phase === 'Merged');

function phaseTrack(phase, compact){
  const idx = PHASES.indexOf(phase);
  return `<ol class="ptrack ${compact ? 'ptrack-c' : ''}" aria-label="Phase ${idx + 1} of 7: ${phase}">${PHASES.map((p,i) =>
    `<li class="${i < idx ? 'past' : i === idx ? 'cur' : ''} ph-${slug(p)}" ${i === idx ? 'aria-current="step"' : ''}><span class="pip"></span><span class="pl">${p}</span></li>`).join('')}</ol>`;
}
const phaseName = p => `<span class="phase-name ph-${slug(p)}">${p}</span>`;

function struggleTags(st){
  if (!st || !st.struggle) return '';
  const g = st.struggle, out = [];
  if (g.failures) out.push(`<span class="tag tag-struggle">${icon('flame')}Struggling · ${g.failures} test failures</span>`);
  if (g.churn) out.push(`<span class="tag tag-struggle">Churn · same ${g.churn} files</span>`);
  if (g.silence) out.push(`<span class="tag tag-struggle">${icon('clock')}Silence · ${g.silence}m</span>`);
  return out.join(' ');
}

function testsLine(t){
  if (!t.hist.length) return `<p class="hint">No test runs yet.</p>`;
  const last = t.hist[t.hist.length - 1];
  return `<div class="tests">
    <span class="tpulse ${last === 'f' ? 'fail' : 'pass'} ${t.running ? 'running' : ''}" aria-hidden="true"></span>
    <span class="${last === 'f' ? 'lbl-fail' : 'lbl-pass'}">${last === 'f' ? 'Failing' : 'Passing'}${t.running ? ' · running…' : ''}</span>
    <span class="mono">${t.pass} passed · ${t.fail} failed</span>
    <span class="thist" aria-label="Last ${Math.min(12, t.hist.length)} runs">${t.hist.slice(-12).map(r => `<i class="${r}"></i>`).join('')}</span>
  </div>`;
}
function diffBar(a, d){
  const tot = a + d || 1, n = 5, ca = Math.round(a / tot * n), cd = Math.min(n - ca, Math.round(d / tot * n));
  return `<span class="dstat" aria-hidden="true">${'<i class="a"></i>'.repeat(ca)}${'<i class="d"></i>'.repeat(cd)}${'<i></i>'.repeat(n - ca - cd)}</span>`;
}
const checkLine = c => {
  const m = { pass:['check','chk-pass','passed'], fail:['x','chk-fail','failed'], pending:['clock','chk-pending','pending'] }[c.st];
  return `<li><span class="${m[1]}">${icon(m[0])}</span><span class="mono">${esc(c.name)}</span><span class="${m[1]}">${m[2]}</span></li>`;
};

/* ---------- Detail blocks (shared by every variant) ---------- */
function needsDetail(s){
  const n = s.needs;
  let body = '';
  if (n.kind === 'permission') body = `<div class="od-stack"><span class="eyebrow">Tool · ${esc(n.tool)}</span><pre class="cmd">${esc(n.command)}</pre><p class="hint" style="color:#e9cf9a">${esc(n.note)}</p></div>`;
  else if (n.kind === 'question') body = `<p class="needs-q">${esc(n.text)}</p>${n.options ? `<div class="opts" aria-label="Options the agent offered">${n.options.map(o => `<span>${esc(o)}</span>`).join('')}</div>` : ''}`;
  else if (n.kind === 'hitl') body = `<p class="needs-q">HITL ticket: ${esc(n.ticket)}</p>`;
  else body = `<p class="needs-q">${esc(n.reason)}</p>`;
  return `<section class="needs-detail" aria-label="Needs you">
    <header>${icon(REASON_ICON[n.kind], '20px')}Needs you · ${REASON[n.kind]}<span class="wait">waiting ${since(s.since)}</span></header>
    <div class="needs-body">${body}
      <dl class="where">
        <div><dt>Machine</dt><dd>${esc(s.machine)}</dd></div>
        <div><dt>Session</dt><dd>${esc(s.sessionName)}</dd></div>
        <div><dt>Terminal</dt><dd>${esc(s.terminal)}</dd></div>
      </dl>
      <div class="od-cluster"><button class="btn btn-needs" data-act="copy" data-text="${esc(resumeCmd(s))}" data-key="copy-${s.id}">${icon('copy')}Copy resume command</button><span class="mono muted">${esc(resumeCmd(s))}</span></div>
    </div>
  </section>`;
}

function stepDetail(s, st){
  const isSpec = s.kind === 'Spec Job';
  const totA = st.commits.reduce((n,c) => n + c.a, 0), totD = st.commits.reduce((n,c) => n + c.d, 0);
  const blocked = st.blockedBy ? s.spec.steps.find(x => x.id === st.blockedBy) : null;
  const ck = st.checklist.findIndex(c => !c[1]);
  let prBlock;
  if (isSpec) {
    const merged = s.spec.merges.find(m => m.step === st.id);
    prBlock = `<h4>Merge into integration branch</h4>${merged
      ? `<p class="hint" style="color:var(--done)">${icon('check')} Merged into <span class="mono">${esc(s.spec.integrationBranch)}</span> · <span class="sha">${merged.sha}</span> · ${since(merged.at)} ago</p>`
      : `<p class="hint">Not merged — merges into <span class="mono">${esc(s.spec.integrationBranch)}</span> after Committed.</p>`}`;
  } else if (st.pr) {
    prBlock = `<h4>Pull request</h4><div class="pr-line">${icon('pr')}<a href="#" class="wi" data-act="noop">PR #${st.pr.num}</a><span class="tag">${st.pr.state}</span><span class="muted">→ ${st.pr.target}</span></div><h4>CI checks</h4><ul class="checks">${st.pr.checks.map(checkLine).join('')}</ul>`;
  } else {
    prBlock = `<h4>Pull request</h4><p class="hint">${esc(st.prNote || 'No PR yet')}</p>`;
  }
  return `<section class="step" aria-label="Step detail">
    <div class="step-h">
      <div class="od-stack" style="--od-gap:2px"><span class="eyebrow">${isSpec ? 'Step · Ticket' : 'Ticket'}</span><h3><a href="#" class="wi" data-act="noop">${esc(st.ticket)}</a></h3></div>
      <div class="od-cluster" style="justify-content:flex-end">${struggleTags(st)}${blocked ? `<span class="tag tag-blocked">Blocked by ${esc(blocked.ticket)}</span>` : ''}${isSpec && isFrontier(s, st) ? '<span class="tag tag-frontier">Frontier</span>' : ''}</div>
    </div>
    <div class="kv"><span class="od-row">${icon('branch')}<span class="mono">${esc(st.branch)}</span></span><span class="od-row">${icon('folder')}<span class="mono">${esc(st.worktree)}</span></span></div>
    ${phaseTrack(st.phase)}
    <p class="phase-time">In ${phaseName(st.phase)} for ${since(st.phaseSince)}</p>
    <div class="step-grid">
      <div class="panel"><h4>Agent checklist (live)</h4><ul class="checklist">${st.checklist.map((c,i) =>
        `<li class="${c[1] ? 'done' : i === ck ? 'cur' : ''}"><span class="cb">${c[1] ? icon('check','12px') : ''}</span><span>${esc(c[0])}</span></li>`).join('')}</ul></div>
      <div class="panel"><h4>Tests</h4>${testsLine(st.tests)}<h4>Files touched</h4>${st.files.length ? `<ul class="files">${st.files.map(f =>
        `<li><span class="path">${esc(f.p)}</span>${f.churn ? `<span class="churn mono">${f.e} edits</span>` : `<span class="muted mono">${f.e} edits</span>`}<span class="add">+${f.a}</span><span class="del">−${f.d}</span></li>`).join('')}</ul>` : '<p class="hint">No files changed yet — still reading.</p>'}</div>
      <div class="panel"><h4>Commits · <span class="add">+${totA}</span> <span class="del">−${totD}</span></h4>${st.commits.length ? `<ul class="commits">${st.commits.map(c =>
        `<li><span class="sha">${c.sha}</span><span class="msg">${esc(c.msg)}</span><span class="add">+${c.a}</span><span class="del">−${c.d}</span>${diffBar(c.a,c.d)}</li>`).join('')}</ul>` : '<p class="hint">No commits yet.</p>'}</div>
      <div class="panel"><h4>Review findings</h4><div class="od-row"><span class="big-num">${st.findings.count}</span><span class="hint">${esc(st.findings.note)}</span></div>${prBlock}</div>
    </div>
    <div class="panel"><h4>Phase events</h4><ol class="events">${[...st.events].reverse().map(e => `<li><time>${clockOf(e.at)}</time><span>${esc(e.t)}</span></li>`).join('')}</ol></div>
  </section>`;
}

function dagSvg(s, selId, scale){
  const steps = s.spec.steps, NW = 232, NH = 88, CG = 84, RG = 26, PAD = 12;
  const depth = {};
  const d = st => depth[st.id] ?? (depth[st.id] = st.deps.length ? 1 + Math.max(...st.deps.map(id => d(steps.find(x => x.id === id)))) : 0);
  steps.forEach(d);
  const cols = [];
  steps.forEach(st => (cols[depth[st.id]] ||= []).push(st));
  const maxRows = Math.max(...cols.map(c => c.length));
  const H = maxRows * NH + (maxRows - 1) * RG, W = cols.length * NW + (cols.length - 1) * CG;
  const pos = {};
  cols.forEach((c, ci) => {
    const off = (H - (c.length * NH + (c.length - 1) * RG)) / 2;
    c.forEach((st, ri) => pos[st.id] = { x: PAD + ci * (NW + CG), y: PAD + off + ri * (NH + RG) });
  });
  const edges = steps.flatMap(st => st.deps.map(dep => {
    const a = pos[dep], b = pos[st.id], ds = steps.find(x => x.id === dep);
    const cls = st.blockedBy === dep ? 'block' : ds.phase === 'Merged' ? '' : 'wait';
    const x1 = a.x + NW, y1 = a.y + NH / 2, x2 = b.x - 6, y2 = b.y + NH / 2;
    return `<path class="edge ${cls}" d="M${x1} ${y1} C${x1 + 40} ${y1}, ${x2 - 40} ${y2}, ${x2} ${y2}" marker-end="url(#arr-${cls || 'm'})"/>`;
  })).join('');
  const nodes = steps.map(st => {
    const p = pos[st.id], idx = PHASES.indexOf(st.phase), fr = isFrontier(s, st);
    const name = st.ticket.length > 24 ? st.ticket.slice(0, 23) + '…' : st.ticket;
    const tag = st.blockedBy ? ['BLOCKED', 'blk', 62] : fr ? ['FRONTIER', '', 70] : null;
    return `<g class="node ${st.id === selId ? 'sel' : ''} ${fr ? 'frontier' : ''}" transform="translate(${p.x},${p.y})" tabindex="0" role="button"
      aria-label="${esc(st.ticket)} — ${st.phase}${fr ? ', frontier' : ''}${st.blockedBy ? ', blocked' : ''}. Open Step" data-act="step" data-sid="${s.id}" data-step="${st.id}" data-key="dag-${s.id}-${st.id}">
      <rect class="nb" width="${NW}" height="${NH}" rx="6"/>
      <text class="nt" x="14" y="28">${esc(name)}</text>
      <text class="np ph-${slug(st.phase)}" x="14" y="52">${st.phase}${st.phase !== 'Merged' ? ' · ' + fmtDur(Date.now() - st.phaseSince) : ''}</text>
      ${tag ? `<rect class="ntag-bg ${tag[1]}" x="${NW - tag[2] - 10}" y="38" width="${tag[2]}" height="20" rx="3"/><text class="ntag ${tag[1]}" x="${NW - tag[2] / 2 - 10}" y="52" text-anchor="middle">${tag[0]}</text>` : ''}
      ${PHASES.map((ph, i) => `<rect class="pp ${i < idx ? 'past' : i === idx ? 'cur ph-' + slug(ph) : ''}" x="${14 + i * 29}" y="${i === idx ? 66 : 68}" width="26" height="${i === idx ? 8 : 5}" rx="1.5"/>`).join('')}
    </g>`;
  }).join('');
  const mk = (id, col) => `<marker id="arr-${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="${col}"/></marker>`;
  const vw = W + PAD * 2, vh = H + PAD * 2;
  return `<svg class="dag" viewBox="0 0 ${vw} ${vh}" width="${vw}" height="${vh}" style="max-width:${Math.round(vw * (scale || 1))}px" role="group" aria-label="Ticket DAG for ${esc(s.workItem.name)}">
    <defs>${mk('m','#4a5263')}${mk('wait','#6b7385')}${mk('block','#ff6b6b')}</defs>${edges}${nodes}</svg>`;
}

function specBlock(s, stepId, scale){
  const sp = s.spec, merged = sp.steps.filter(x => x.phase === 'Merged').length;
  return `<section class="spec" aria-label="Spec Job">
    <div class="spec-meta">
      <div class="od-stat"><span class="eyebrow">Integration branch</span><span class="v">${esc(sp.integrationBranch)}</span></div>
      <div class="od-stat"><span class="eyebrow">Merged</span><span class="v">${merged} / ${sp.steps.length} Tickets</span></div>
      <div class="od-stat"><span class="eyebrow">Final code review</span><span class="v">${esc(sp.finalReview.status)}</span></div>
      <div class="od-stat"><span class="eyebrow">Spec PR</span><span class="v">#${sp.pr.num} · ${sp.pr.state}</span></div>
    </div>
    <div class="dag-wrap">
      ${dagSvg(s, stepId, scale)}
      <div class="dag-legend"><span><span class="lg-line"></span>dependency merged</span><span><span class="lg-line wait"></span>waiting on dependency</span><span><span class="lg-line block"></span>blocking</span><span><span class="tag tag-frontier">Frontier</span>unblocked, not yet merged</span><span>Click a Ticket to open its Step</span></div>
    </div>
    <div class="spec-cols">
      <div class="panel"><h4>Merges into ${esc(sp.integrationBranch)}</h4><ul class="merges">${sp.merges.map(m => {
        const st = sp.steps.find(x => x.id === m.step);
        return `<li><span style="color:var(--done)">${icon('check')}</span><span class="od-fill">${esc(st.ticket)}</span><span class="sha">${m.sha}</span></li>`;
      }).join('')}</ul><p class="hint">${sp.steps.length - merged} Tickets not yet merged.</p></div>
      <div class="panel"><h4>Final code review</h4><p class="hint">${esc(sp.finalReview.note)}</p></div>
      <div class="panel"><h4>Pull request</h4><div class="pr-line">${icon('pr')}<a href="#" class="wi" data-act="noop">PR #${sp.pr.num}</a><span class="muted">${esc(sp.integrationBranch)} → ${sp.pr.target}</span></div>
        <div class="prtrack" aria-label="PR state: ${sp.pr.state}">${['Draft','Ready','Merged'].map(x => `<span class="${x === sp.pr.state ? 'cur' : ''}">${x}</span>`).join('→')}</div>
        <ul class="checks">${sp.pr.checks.map(checkLine).join('')}</ul></div>
    </div>
  </section>`;
}

function planningBlock(s){
  return `<div class="step-grid">
    <div class="panel"><h4>Last actions</h4><ol class="actions-list">${s.actions.slice(-4).reverse().map(a => `<li><time>${clockOf(a.at)}</time><span>${esc(a.t)}</span></li>`).join('')}</ol></div>
    <div class="panel">${s.created ? `<h4>Created ${s.created.length} Tickets</h4><ul class="files">${s.created.map(t => `<li>${icon('check')}<a href="#" class="wi" data-act="noop">${esc(t)}</a></li>`).join('')}</ul>` : ''}
      ${s.decision ? `<h4>Decision ticket</h4><p style="margin:0"><a href="#" class="wi" data-act="noop">${esc(s.decision.name)}</a> <span class="tag">${esc(s.decision.tag)}</span></p>` : ''}
      <h4>History</h4><p style="margin:0"><a href="#" class="wi" data-act="noop">Session history</a> <span class="muted">(stub in this pass)</span></p></div>
  </div>`;
}

function sessionDetail(s, stepId, ctx){
  const st = stepFor(s, stepId);
  const back = ctx !== 'centre';
  const crumbs = [
    back ? `<button data-act="close" data-key="crumb-ov">Overview</button>` : `<span>Overview</span>`,
    `<span>${esc(s.machine)} · ${esc(s.repo)}</span>`,
  ];
  if (s.kind === 'Spec Job') crumbs.push(st ? `<button data-act="step" data-sid="${s.id}" data-step="" data-key="crumb-job">Spec Job · ${esc(s.workItem.name)}</button>` : `<span class="cur">Spec Job · ${esc(s.workItem.name)}</span>`);
  else crumbs.push(`<span class="${st ? '' : 'cur'}">${esc(s.kind)}</span>`);
  if (st) crumbs.push(`<span>Step · ${esc(st.ticket)}</span>`, `<span class="cur">Phase · ${st.phase}</span>`);
  let body = '';
  if (s.kind === 'Spec Job') body = specBlock(s, stepId, ctx === 'centre' ? 1.35 : 1) + (st ? stepDetail(s, st) : `<p class="hint">Select a Ticket in the DAG to open its Step — Phase, checklist, tests, files and commits.</p>`);
  else if (s.kind === 'Ticket Job') body = stepDetail(s, st);
  else body = planningBlock(s);
  return `<div class="detail">
    <nav class="crumbs" aria-label="Zoom level">${crumbs.join('<span aria-hidden="true">›</span>')}</nav>
    <header class="sd-h">
      <span class="eyebrow">${esc(s.kind)}${s.workItem ? ' · ' + esc(s.workItem.type) : ''}</span>
      <h2>${wiLink(s)}</h2>
      ${s.decision ? `<span class="sub-wi">Decision ticket: <a href="#" class="wi" data-act="noop">${esc(s.decision.name)}</a> (${esc(s.decision.tag)})</span>` : ''}
      <div class="sd-meta">${stateBadge(s)}<span>in state ${since(s.since)}</span><span class="od-row" style="--od-gap:6px">${icon('terminal')}<span class="mono">${esc(s.machine)}</span>·<span class="mono">${esc(s.sessionName)}</span></span><span>repo <span class="mono">${esc(s.repo)}</span></span>${struggleTags(s.step)}</div>
      ${nowLine(s)}
    </header>
    ${s.needs ? needsDetail(s) : ''}
    ${body}
  </div>`;
}

/* ================= Variant A — Triage list ================= */
function renderA(){
  const groups = [
    { k:'needs', cls:'grp-needs', title:'Needs you', sub:'agents are blocked on you' },
    { k:'done', cls:'grp-done', title:'Done — unseen' },
    { k:'working', cls:'grp-working', title:'Working' },
    { k:'stale', cls:'grp-stale', title:'Stale' },
    { k:'done-seen', cls:'grp-seen', title:'Done — seen' },
  ];
  const rows = sorted(DATA.sessions);
  const body = groups.map(g => {
    const list = rows.filter(s => stateKey(s) === g.k);
    if (!list.length) return '';
    const head = g.k === 'needs'
      ? `<tr class="grp-h"><th colspan="7"><span class="od-row"><span class="ink-dot pulse" aria-hidden="true"></span>${g.title}<span class="gc">${list.length}</span><span style="text-transform:none;font-weight:500;font-family:var(--font-body);font-size:var(--fs-md);letter-spacing:0">— ${list.length} ${g.sub}</span></span></th></tr>`
      : `<tr class="grp-h"><th colspan="7">${g.title}<span class="gc">${list.length}</span></th></tr>`;
    return `<tbody class="${g.cls}">${head}${list.map(rowA).join('')}</tbody>`;
  }).join('');
  return `<main class="va">
    <div class="va-head"><h1>Tracked sessions</h1><p>Needs you first, then Done (unseen), Working, Stale. Click a row for Job → Step → Phase.</p></div>
    <table class="tri">
      <colgroup><col class="c-state"><col class="c-mach"><col class="c-repo"><col class="c-kind"><col class="c-wi"><col><col class="c-time"></colgroup>
      <thead><tr><th>State</th><th>Machine</th><th>Tracked repo</th><th>Kind</th><th>Work item</th><th>Headline</th><th>In state</th></tr></thead>
      ${body}
    </table>
  </main>`;
}
function rowA(s){
  const st = s.step;
  const sel = ui.drawer && ui.sel && ui.sel.sid === s.id;
  let sub = '';
  if (st) sub = `<span class="tsub">${st.phase} ${fmtDur(Date.now() - st.phaseSince)}</span>`;
  if (s.spec) sub = `<span class="tsub">${s.spec.steps.filter(x => x.phase === 'Merged').length} / ${s.spec.steps.length} merged</span>`;

const trunc = (t, n) => t.length > n ? t.slice(0, n - 1) + '…' : t;
function wrapTxt(t, max, lines){
  const out = [''];
  for (const w of t.split(' ')) {
    const cur = out[out.length - 1], next = (cur + ' ' + w).trim();
    if (next.length <= max) { out[out.length - 1] = next; continue; }
    if (out.length === lines) { out[lines - 1] = trunc(cur + ' ' + w, max); return out; }
    out.push(w);
  }
  return out;
}
const fmtSec = s => s >= 3600 ? `${Math.floor(s / 3600)}h ${String(Math.floor(s % 3600 / 60)).padStart(2,'0')}m` : `${Math.floor(s / 60)}m ${String(Math.floor(s % 60)).padStart(2,'0')}s`;

/* ---------- ONE graph grammar: left→right; solid = resolved, dashed grey = waiting, dashed red = blocking, dashed blue + FRONTIER = takeable ---------- */
function graphE(c){
  const NW = c.NW, NH = c.NH, CG = 64, RG = 20, PAD = 16, FOGW = 200;
  const byN = Object.fromEntries(c.nodes.map(n => [n.id, n]));
  const depth = {};
  const d = n => depth[n.id] ?? (depth[n.id] = n.deps.length ? 1 + Math.max(...n.deps.map(id => d(byN[id]))) : 0);
  c.nodes.forEach(d);
  const cols = [];
  c.nodes.forEach(n => (cols[depth[n.id]] ||= []).push(n));
  const maxRows = Math.max(...cols.map(x => x.length));
  const fogN = c.fog ? c.fog.length : 0;
  const H = Math.max(maxRows * NH + (maxRows - 1) * RG, fogN * 120);
  const GW = cols.length * NW + (cols.length - 1) * CG;
  const W = GW + (fogN ? CG + FOGW : 0);
  const pos = {};
  cols.forEach((col, ci) => {
    const off = (H - (col.length * NH + (col.length - 1) * RG)) / 2;
    col.forEach((n, ri) => pos[n.id] = { x: PAD + ci * (NW + CG), y: PAD + off + ri * (NH + RG) });
  });
  const mk = (id, col) => `<marker id="${c.gid}-arr-${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="${col}"/></marker>`;
  const edges = c.nodes.flatMap(n => n.deps.map(dep => {
    const a = pos[dep], b = pos[n.id];
    const cls = n.blockedBy === dep ? 'block' : c.resolved(byN[dep]) ? '' : 'wait';
    const x1 = a.x + NW, y1 = a.y + NH / 2, x2 = b.x - 6, y2 = b.y + NH / 2;
    return `<path class="edge ${cls}" d="M${x1} ${y1} C${x1 + 40} ${y1}, ${x2 - 40} ${y2}, ${x2} ${y2}" marker-end="url(#${c.gid}-arr-${cls || 'm'})"/>`;
  })).join('');
  const nodes = c.nodes.map(n => {
    const p = pos[n.id], fr = c.frontier(n);
    return `<g class="node ${n.id === c.selId ? 'sel' : ''} ${fr ? 'frontier' : ''} ${c.muted && c.muted(n) ? 'muted' : ''} ${n.needs ? 'needs' : ''}" transform="translate(${p.x},${p.y})" tabindex="0" role="button"
      aria-label="${esc(c.label(n, fr))}" data-act="gnode" data-node="${n.id}" data-key="g-${c.gid}-${n.id}"><rect class="nb" width="${NW}" height="${NH}" rx="6"/>${c.body(n, NW, NH, fr)}</g>`;
  }).join('');
  let fog = '';
  if (fogN) {
    const fx = PAD + GW + CG, step = H / fogN;
    fog = `<text class="fog-h" x="${fx + FOGW / 2}" y="12" text-anchor="middle">NOT YET SPECIFIED</text>` + c.fog.map((f, i) => {
      const cx = fx + FOGW / 2, cy = PAD + step * i + step / 2;
      return `<g class="fog" role="img" aria-label="Not yet specified: ${esc(f)}"><g filter="url(#${c.gid}-blur)"><ellipse cx="${cx - 36}" cy="${cy}" rx="64" ry="30"/><ellipse cx="${cx + 30}" cy="${cy - 8}" rx="70" ry="34"/><ellipse cx="${cx + 8}" cy="${cy + 14}" rx="78" ry="26"/></g><text class="fog-t" x="${cx}" y="${cy + 5}" text-anchor="middle">${esc(f)}</text></g>`;
    }).join('');
  }
  const vw = W + PAD * 2, vh = H + PAD * 2;
  return `<svg class="dag gsvg" viewBox="0 0 ${vw} ${vh}" width="${vw}" height="${vh}" ${ui.mapFit && c.fit ? '' : `style="width:${vw}px"`} role="group" aria-label="${esc(c.title)}">
    <defs>${mk('m','#4a5263')}${mk('wait','#6b7385')}${mk('block','#ff6b6b')}<filter id="${c.gid}-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter></defs>${edges}${nodes}${fog}</svg>`;
}
function badgeSvg(x, y, t, cls){
  const w = Math.round(t.length * 6.6 + 12);
  return [`<rect class="gb ${cls}" x="${x}" y="${y}" width="${w}" height="18" rx="3"/><text class="gbt ${cls}" x="${x + w / 2}" y="${y + 13}" text-anchor="middle">${esc(t)}</text>`, w];
}
function decisionBody(n, W, H, fr){
  let out = wrapTxt(n.name, 30, 2).map((l, i) => `<text class="gt" x="14" y="${24 + i * 18}">${esc(l)}</text>`).join('');
  let x = 14;
  for (const [t, cls] of [[n.type.toUpperCase(), 'type'], [modeOf(n), 'mode']]) { const [s, w] = badgeSvg(x, 52, t, cls); out += s; x += w + 6; }
  const tag = n.needs ? ['NEEDS YOU','needs'] : n.blockedBy ? ['BLOCKED','blk'] : fr ? ['FRONTIER','fr'] : null;
  if (tag) out += badgeSvg(W - Math.round(tag[0].length * 6.6 + 12) - 12, 52, tag[0], tag[1])[0];
  const st = n.state === 'closed' ? 'closed' : n.claimedBy ? `claimed by ${sessName(n.claimedBy)}` : 'open';
  out += `<text class="gs st-${n.state}" x="14" y="88">${esc(trunc(st, 34))}</text>`;
  if (n.state === 'closed') out += `<text class="gs2" x="14" y="104">${esc(trunc(n.gist, 38))}</text>`;
  else if (n.blockedBy) out += `<text class="gs2 blk" x="14" y="104">${esc(trunc('blocked by ' + dnode(n.blockedBy).name, 38))}</text>`;
  else if (fr) out += `<text class="gs2 fr" x="14" y="104">takeable now</text>`;
  return out;
}
function ticketBody(n, W, H, fr){
  let out = wrapTxt(n.name, 26, 1).map((l, i) => `<text class="gt" x="14" y="${26 + i * 18}">${esc(l)}</text>`).join('');
  out += badgeSvg(14, 40, 'NOT STARTED', 'ns')[0];
  if (fr) out += badgeSvg(W - Math.round(8 * 6.6 + 12) - 12, 40, 'FRONTIER', 'fr')[0];
  return out;
}

/* ---------- E interactions ---------- */
let replayTimer = null;
function stopReplay(){ if (replayTimer) clearInterval(replayTimer); replayTimer = null; if (ui.replay) ui.replay.playing = false; }
function updateReplay(){
  const live = document.getElementById('replay-live');
  if (!live || !ui.replay) { stopReplay(); return; }
  const h = histById(ui.replay.id), max = h.dur * 60, r = ui.replay;
  const keep = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.key : null;
  live.innerHTML = replayLive(h);
  const range = document.getElementById('replay-range');
  if (range && !r.dragging) range.value = Math.round(r.pos);
  document.getElementById('rp-time').textContent = `${fmtSec(r.pos)} / ${fmtSec(max)}`;
  const b = document.querySelector('[data-key="rplay"]');
  if (b) { b.innerHTML = icon(r.playing ? 'pause' : 'play', '18px'); b.setAttribute('aria-pressed', String(r.playing)); b.setAttribute('aria-label', (r.playing ? 'Pause' : 'Play') + ' replay'); }
  if (keep && keep.startsWith('rj-')) { const el = document.querySelector(`[data-key="${keep}"]`); if (el) el.focus({ preventScroll:true }); }
}
function togglePlay(){
  const r = ui.replay; if (!r) return;
  if (r.playing) { stopReplay(); updateReplay(); return; }
  const max = histById(r.id).dur * 60;
  if (r.pos >= max) r.pos = 0;
  r.playing = true;
  replayTimer = setInterval(() => { r.pos = Math.min(max, r.pos + max / 120); if (r.pos >= max) stopReplay(); updateReplay(); }, 100);
  updateReplay();
}
const scrollCentreTop = () => { const c = document.querySelector('[data-scroll="c-centre"]'); if (c) c.scrollTop = 0; };
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || ui.variant !== 'E') return;
  const a = el.dataset.act;
  if (a === 'machine') { stopReplay(); ui.eview = 'machine'; ui.emachine = el.dataset.m; render(); scrollCentreTop(); }
  else if (a === 'history') { stopReplay(); ui.eview = 'history'; render(); scrollCentreTop(); }
  else if (a === 'replay') { stopReplay(); ui.eview = 'replay'; ui.replay = { id: el.dataset.h, pos: 0, playing: false, dragging: false }; render(); scrollCentreTop(); const p = document.querySelector('[data-key="rplay"]'); if (p) p.focus(); }
  else if (a === 'gnode') { ui.gsel = el.dataset.node; render(); }
  else if (a === 'mapfit') { ui.mapFit = !ui.mapFit; render(); }
  else if (a === 'open-map-node') { stopReplay(); ui.eview = 'session'; ui.sel = { sid:'wf-dash', step:null }; ui.gsel = el.dataset.node; render(); scrollCentreTop(); }
  else if (a === 'rplay') togglePlay();
  else if (a === 'replay-jump' && ui.replay) { stopReplay(); ui.replay.pos = Number(el.dataset.t); updateReplay(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'replay-range' && ui.replay) { stopReplay(); ui.replay.pos = Number(e.target.value); updateReplay(); }
});
document.addEventListener('pointerdown', e => { if (e.target.id === 'replay-range' && ui.replay) ui.replay.dragging = true; });
document.addEventListener('pointerup', () => {

});

/* E-only liveness: to-spec writes sections, research runs more searches */
const RS_QUEUE = [['searches','claude code hooks Notification event permission prompt'],['sources','https://docs.github.com/en/rest/commits/statuses'],['searches','measure time in phase from hook timestamps'],['sources','https://docs.anthropic.com/en/docs/claude-code/settings']];
let eTick = 0;
setInterval(() => {
  eTick++;
  const now = Date.now(), ts = byId('ts-chunks'), rs = byId('rs-fields');
  if (eTick % 4 === 0) {
    const i = ts.outline.findIndex(o => !o[1]);
    if (i >= 0) {
      ts.outline[i][1] = 1;
      ts.actions.push({ at:now, t:`Wrote section "${ts.outline[i][0]}"` });
      const nx = ts.outline[i + 1];
      ts.now = nx ? `writing section "${nx[0]}"` : 'outline complete — ready to publish';
    }
  }
  ts.lastEvent = now;
  if (eTick % 3 === 0 && RS_QUEUE.length) {
    const [k, v] = RS_QUEUE.shift();
    rs.research[k].push(v);
    rs.now = k === 'searches' ? `searching: ${v}` : `fetched ${v.replace(/^https:\/\//, '')}`;
    rs.actions.push({ at:now, t: k === 'searches' ? `Searched: ${v}` : `Fetched ${v}` });
  }
  rs.lastEvent = now;
}, 5000);

/* ================= Render ================= */
function render(){
  if (ui.variant === 'E' && ui.replay && ui.replay.dragging) { ui.pendingRender = true; return; }
  const keep = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.key : null;
  const scrolls = {};
  document.querySelectorAll('[data-scroll]').forEach(el => scrolls[el.dataset.scroll] = [el.scrollTop, el.scrollLeft]);

  const tipKey = ui.tipKey;
  const before = {};
  if (ui.variant === 'D' || ui.variant === 'E') document.querySelectorAll('.fchip[data-key]').forEach(el => { before[el.dataset.key] = el.getBoundingClientRect(); });

  root.innerHTML = ui.variant === 'E' ? renderTopE() + renderE() : renderTop() + (ui.variant === 'A' ? renderA() : ui.variant === 'B' ? renderB() : ui.variant === 'C' ? renderC() : renderD());

  // flow strip: chips that changed Phase column glide from their old spot (FLIP, transform only)
  if ((ui.variant === 'D' || ui.variant === 'E') && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const moved = [];
    document.querySelectorAll('.fchip[data-key]').forEach(el => {
      const b = before[el.dataset.key]; if (!b) return;
      const a = el.getBoundingClientRect(), dx = b.left - a.left, dy = b.top - a.top;
      if (Math.abs(dx) < 4 && Math.abs(dy) < 4) return;
      el.style.transition = 'none';
      el.style.transform = `translate(${dx}px, ${dy}px)`;
      moved.push(el);
    });
    if (moved.length) {
      const flow = document.querySelector('.flow');
      flow.classList.add('animating');
      requestAnimationFrame(() => requestAnimationFrame(() => {
        moved.forEach(el => { el.style.transition = 'transform 400ms var(--ease-out)'; el.style.transform = ''; el.classList.add('moved'); });
        setTimeout(() => flow.classList.remove('animating'), 450);
      }));
    }
  }
  if (tipKey && (ui.variant === 'D' || ui.variant === 'E')) { const el = document.querySelector(`.fchip[data-key="${tipKey}"]`); if (el) showTip(el); else hideTip(); }
  else hideTip();

  const selS = ui.sel ? byId(ui.sel.sid) : null;
  if (ui.variant === 'A' && ui.drawer && selS) {
    document.getElementById('drawer-body').innerHTML = sessionDetail(selS, ui.sel.step, 'drawer');
    drawer.hidden = false;
  } else drawer.hidden = true;

  if (ui.variant === 'B' && ui.modal && selS) {
    document.getElementById('modal-body').innerHTML = sessionDetail(selS, ui.sel.step, 'modal');
    if (!modal.open) modal.showModal();
  } else if (modal.open) modal.close();

  document.querySelectorAll('[data-scroll]').forEach(el => { const v = scrolls[el.dataset.scroll]; if (v) { el.scrollTop = v[0]; el.scrollLeft = v[1]; } });
  if (keep) { const el = document.querySelector(`[data-key="${keep}"]`); if (el) el.focus({ preventScroll:true }); }

  const needs = DATA.sessions.filter(s => s.state === 'Needs you').length;
  document.title = (needs ? `(${needs}) Needs you · ` : '') + 'Factory';
  const v = VARIANTS.find(x => x.id === ui.variant);
  document.getElementById('sw-name').textContent = `${v.id} (${v.name})`;
}

function updateClocks(){

/* ================= Actions ================= */
function openSession(sid, step){
  const s = byId(sid);
  if (!s) return;
  if (s.state === 'Done') s.seen = true;
  const active = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.key : null;

  if (ui.variant === 'A') { ui.returnKey = 'row-' + sid; ui.drawer = true; render(); document.querySelector('[data-key="drawer-close"]').focus(); }
  else if (ui.variant === 'B') { ui.returnKey = active; ui.modal = true; render(); document.querySelector('[data-key="modal-close"]').focus(); }
  else { if (ui.variant === 'E') { stopReplay(); ui.eview = 'session'; ui.gsel = null; } render(); const c = document.querySelector('[data-scroll="c-centre"]'); if (c) c.scrollTop = 0; }
}
function closeDetail(){
  if (ui.variant === 'A' && ui.drawer) {
    ui.drawer = false; render();

    if (el) el.focus();

modal.addEventListener('close', () => {
  if (!ui.modal) return;
  ui.modal = false;
  render();
  const el = (ui.returnKey && document.querySelector(`[data-key="${ui.returnKey}"]`)) || document.querySelector('.bitem, .card');

});

function setVariant(id){
  ui.drawer = false; ui.modal = false;
  if (modal.open) modal.close();
  ui.variant = id;
  if (id !== 'C' && id !== 'D' && id !== 'E') ui.sel = null;
  if (id !== 'E') stopReplay();
  try {
    const u = new URL(location.href);
    u.searchParams.set('variant', id);
    history.replaceState(null, '', u);
  } catch (e) { /* URL update blocked in sandbox — view still switches */ }
  render();
  window.scrollTo(0, 0);
}
function cycle(dir){
  const i = VARIANTS.findIndex(v => v.id === ui.variant);
  setVariant(VARIANTS[(i + dir + VARIANTS.length) % VARIANTS.length].id);
}

let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
}

let actx;
function chime(){
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t = actx.currentTime;
    [[880, 0], [1318.5, 0.14], [1760, 0.28]].forEach(([f, d], i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = i === 2 ? 'triangle' : 'sine';
      o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + d);
      g.gain.exponentialRampToValueAtTime(i === 2 ? 0.12 : 0.22, t + d + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.55);
      o.connect(g).connect(actx.destination);
      o.start(t + d); o.stop(t + d + 0.6);
    });
  } catch (e) { toast('Audio is unavailable in this preview.'); }
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (el.tagName === 'A') e.preventDefault();
  switch (act) {
    case 'noop': toast('Links are stubs in this prototype.'); break;
    case 'open': openSession(el.dataset.sid, el.dataset.step); break;
    case 'step': ui.sel = { sid: el.dataset.sid, step: el.dataset.step || null }; render(); break;
    case 'close': closeDetail(); break;
    case 'sound': chime(); break;
    case 'prev': cycle(-1); break;
    case 'next': cycle(1); break;
    case 'seen': { const s = byId(el.dataset.sid); if (s) s.seen = true; render(); const f = document.querySelector('.dcard button, .inbox .btn'); if (f) f.focus(); break; }
    case 'copy': {
      const text = el.dataset.text;
      const ok = () => toast('Copied: ' + text), no = () => toast('Copy blocked here — run: ' + text);
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, no); else no();
      break;
    }
  }
});

document.addEventListener('keydown', e => {
  const t = e.target;
  const typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
  if ((e.key === 'Enter' || e.key === ' ') && t && t.dataset && t.dataset.act && t.tagName !== 'BUTTON' && t.tagName !== 'A') {
    e.preventDefault(); t.click(); return;
  }
  if (e.key === 'Escape' && ui.variant === 'A' && ui.drawer) { closeDetail(); return; }
  if (typing || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); cycle(-1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); cycle(1); }
});

/* ================= Simulated liveness ================= */
let tick = 0;
const specHeads = [
  'CSV writer — making the header-row test pass',
  'S3 upload client — reviewer reading the diff',
  'CLI flag --export — exploring src/cli/args.ts',
  'Retry + backoff — test "retries 3× on 503" failing',
];
const adhocHeads = ['reading src/render/chunk.ts','grep "seamOffset" src/','reading src/render/tileAtlas.ts','reading src/render/chunk.ts'];
function live(){
  tick++;
  const now = Date.now();
  const spec = byId('spec-order-export'), seam = byId('tj-seam'), adhoc = byId('adhoc-worlds');
  const steps = spec.spec.steps, csv = steps[1], s3 = steps[2], retry = steps[3], cli = steps[4];

  spec.now = specHeads[tick % specHeads.length];
  spec.lastEvent = now;

  if (tick === 5) { csv.phase = 'Refactor'; csv.phaseSince = now; csv.checklist[3][1] = 0; csv.events.push({ at:now, t:'Green → Refactor' }); spec.now = 'CSV writer — Green → Refactor'; }
  if (tick === 9) { csv.checklist[3][1] = 1; csv.commits.push({ sha:'d4e7c12', msg:'refactor: extract row serializer', a:38, d:29 }); csv.events.push({ at:now, t:'Committed d4e7c12' }); }
  if (tick === 13) { csv.phase = 'Reviewing'; csv.phaseSince = now; csv.events.push({ at:now, t:'Refactor → Reviewing' }); spec.now = 'CSV writer — Refactor → Reviewing'; }
  if (tick === 7) { s3.findings.count = 3; s3.checklist[3][1] = 1; s3.events.push({ at:now, t:'Self-review done — 3 findings' }); }
  if (tick === 4) { cli.checklist[1][1] = 1; cli.events.push({ at:now, t:'Found flag registry in src/cli/args.ts' }); }
  if (tick === 11) { cli.phase = 'Red'; cli.phaseSince = now; cli.files.push({ p:'test/cli/export-flag.test.ts', a:22, d:0, e:1 }); cli.tests = { pass:0, fail:1, hist:['f'] }; cli.checklist[2][1] = 1; cli.events.push({ at:now, t:'Exploring → Red — 1 failing' }); }
  if (tick % 6 === 3) { retry.tests.hist.push('f'); retry.events.push({ at:now, t:'Tests failed (2) — still blocked on S3 upload client' }); }

  // worlds struggling Ticket Job: test runs keep failing, same files churn
  const st = seam.step;
  st.tests.running = false;
  if (tick % 3 === 1) { st.tests.running = true; seam.now = `re-running tests (attempt ${st.struggle.failures + 1})`; }
  else if (tick % 3 === 2) {
    st.struggle.failures++; st.tests.hist.push('f');
    st.events.push({ at:now, t:`Tests failed (2) — attempt ${st.struggle.failures}` });
    seam.now = 'editing src/render/chunk.ts (again)';
    st.files[0].e++; st.files[0].a += 3; st.files[0].d += 3;
  } else { seam.now = 'editing src/render/tileAtlas.ts'; st.files[1].e++; }
  seam.lastEvent = now;

  adhoc.now = adhocHeads[tick % adhocHeads.length];
  adhoc.lastEvent = now;
  if (tick % 2 === 0) { adhoc.actions.push({ at:now, t: adhoc.now.charAt(0).toUpperCase() + adhoc.now.slice(1) }); if (adhoc.actions.length > 8) adhoc.actions.shift(); }

  render();
}

render();
setInterval(updateClocks, 1000);
setInterval(live, 4000);
})();
</script>
