# Development only: the tests' environment. At runtime every script runs through
# `uv run --script` with its own PEP 723 deps (ADR 0001); keep these in step with bin/factory.
[project]
name = "software-factory-dev"
version = "0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "typer>=0.15",
  "httpx>=0.27",
  "pytest>=8",
  "pytest-timeout>=2.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["server", "cli"]
timeout = 60
