name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  seams:
    name: Seams (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Seam 1 (server API) and seam 2 (hook and CLI processes)
        run: uv run --group dev pytest -v

  dashboard:
    name: Dashboard bundle matches source
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Committed dist/ is the build of this source
        run: |
          git status --porcelain -- dist
          test -z "$(git status --porcelain -- dist)"
